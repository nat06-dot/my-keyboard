; ESP32-S3 USB Host to BLE Keyboard Bridge
; Board: ESP32-S3-DevKitC-1 N16R8 (Flash 16MB / PSRAM 8MB OPI)

[env:esp32s3_usb_ble]
platform =  espressif32@6.7.0
board = esp32-s3-devkitc-1

framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L

; 1. ยกเลิกระบบจำกัดความเร็วรุ่นเก่า
build_unflags = 
    -std=gnu++11
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os

; 2. ตั้งค่าสปีดเทอร์โบ และเปิดใช้งานระบบ PSRAM 8MB ให้ถูกต้อง
build_flags = 
    -std=gnu++17
    -O3 
    -DCORE_DEBUG_LEVEL=0            ; ปิด Debug Log เพื่อลดดีเลย์
    -DARDUINO_USB_MODE=0            ; ปิดโหมด Device เพื่อเอาพอร์ต Native ไปทำ Host คีย์บอร์ด
    -DARDUINO_USB_CDC_ON_BOOT=0     ; บังคับให้ Serial วิ่งกลับไปออกช่อง UART (แม้ชิป UART จะพัง)
    -D CONFIG_BT_NIMBLE_NVS_PERSIST=1
    -DUSE_NIMBLE
    -DBOARD_HAS_PSRAM               ; 🟢 บังคับเปิดใช้งานสิทธิ์ PSRAM 8MB ให้ระบบรับรู้

lib_deps =
    ; ESP32 USB Host HID - ไลบรารีสำหรับดึงค่าจากคีย์บอร์ดสาย
    https://github.com/esp32beans/ESP32_USB_Host_HID.git
    ; ESP32 BLE Combo - ส่งค่าบลูทูธคีย์บอร์ด
    https://github.com/Kopunk/ESP32-BLE-Combo.git
    ; NimBLE - สแต็กบลูทูธขนาดจิ๋วเพื่อความเสถียร
    h2zero/NimBLE-Arduino @ ^1.4.1

lib_ldf_mode = deep

; 🟢 [จุดตายที่แก้ไข] ตั้งค่าหน่วยความจำสำหรับ N16R8 (แก้ Boot Loop)
board_build.flash_mode = dio        ; 🟢 บังคับใช้ DIO (แก้ปัญหา Flash ค้างจนรีบูตรัว ๆ)
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv

; ตัวถอดรหัส Debug เวลาเกิดอาการแครช
monitor_filters = esp32_exception_decoder